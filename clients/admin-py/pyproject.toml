[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ultrafast-admin"
version = "2.0.0b2"
description = "Typed Python client for the UltraFast AI Gateway admin API (/api), with sync and async calls."
readme = "README.md"
# The generator (openapi-python-client 0.29) emits Python 3.11 code (typing.Self).
requires-python = ">=3.11"
license = "MIT"
dependencies = ["httpx>=0.27,<1", "attrs>=23.2"]

[project.optional-dependencies]
test = ["pytest>=8", "pytest-asyncio>=0.23"]

[tool.setuptools.packages.find]
include = ["ultrafast_admin*"]

[tool.setuptools.package-data]
ultrafast_admin = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 120
extend-exclude = ["ultrafast_admin/_generated"]
