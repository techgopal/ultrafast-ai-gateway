version: 2
updates:
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
    groups:
      cargo-minor-patch:
        update-types: [minor, patch]
  - package-ecosystem: npm
    directory: /ui
    schedule:
      interval: weekly
    ignore:
      # Node 22 is the supported runtime; its type definitions follow it.
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
    groups:
      ui-minor-patch:
        update-types: [minor, patch]
  - package-ecosystem: npm
    directory: /clients/ts
    schedule:
      interval: weekly
    ignore:
      # Node 22 is the supported runtime; its type definitions follow it.
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
    groups:
      client-ts-minor-patch:
        update-types: [minor, patch]
  - package-ecosystem: pip
    directory: /crates/client-py
    schedule:
      interval: weekly
    groups:
      client-py-minor-patch:
        update-types: [minor, patch]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions-minor-patch:
        update-types: [minor, patch]
