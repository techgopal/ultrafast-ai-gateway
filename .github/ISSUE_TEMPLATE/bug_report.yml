name: Bug report
description: Something does not work as documented
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Do not paste keys, passwords, tokens or provider credentials. For a security problem, use the security policy instead of this form.
  - type: input
    id: version
    attributes:
      label: Version
      description: Output of `ultrafast --version`, or the image tag.
      placeholder: 2.0.0-beta.4
    validations:
      required: true
  - type: dropdown
    id: install
    attributes:
      label: How you run it
      options:
        - Release binary
        - Docker image
        - Built from source
    validations:
      required: true
  - type: textarea
    id: what-happened
    attributes:
      label: What happened
      description: What you did, what you expected, and what you saw instead.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. ...
        2. ...
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Logs or output
      description: Relevant gateway output or error bodies, with secrets removed.
      render: text
