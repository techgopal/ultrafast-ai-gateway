name: Feature request
description: Suggest an improvement
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: The problem
      description: What are you trying to do, and what gets in the way?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: What you would like
      description: How it could work. Alternatives you considered are welcome.
    validations:
      required: true
  - type: textarea
    id: context
    attributes:
      label: Context
      description: Your setup (teams, providers, scale) if it matters. No secrets.
