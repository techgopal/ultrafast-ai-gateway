# On a tag `v*`: the console is built once, the binaries are built with it
# embedded (the gateway compiles `ui/dist` into the binary, so the console
# must exist before cargo runs), a DRAFT GitHub release gets the archives and
# their checksums, and the image goes to ghcr.io.
#
# By hand (workflow_dispatch): the same builds, kept as artifacts of the run.
# Nothing is published: the jobs that publish run for the push of a tag only.
#
# Not here yet: publishing the crates to crates.io (LATER), other registries.
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  # First, so that a mistyped tag costs seconds, not the builds: a tag that
  # does not name the version of the workspace is a mistake, and nothing is
  # built or released from it. A manual run has no tag to check.
  version:
    name: Version
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: The tag names the version
        if: github.event_name == 'push'
        run: |
          tag="${GITHUB_REF_NAME#v}"
          version=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -n 1)
          if [ "$tag" != "$version" ]; then
            echo "The tag $GITHUB_REF_NAME names version $tag; Cargo.toml has $version." >&2
            exit 1
          fi

  console:
    name: Console
    needs: version
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          package_json_file: ui/package.json
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: ui/pnpm-lock.yaml
      - name: Build the console
        run: |
          pnpm --dir ui install --frozen-lockfile
          pnpm --dir ui build
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: console
          path: ui/dist
          if-no-files-found: error
          retention-days: 7

  build:
    name: Binary ${{ matrix.target }}
    needs: console
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-musl
            os: ubuntu-latest
            archive: tar.gz
          - target: aarch64-unknown-linux-musl
            os: ubuntu-24.04-arm
            archive: tar.gz
          - target: x86_64-apple-darwin
            os: macos-15-intel
            archive: tar.gz
          - target: aarch64-apple-darwin
            os: macos-15
            archive: tar.gz
          - target: x86_64-pc-windows-msvc
            os: windows-latest
            archive: zip
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      # Before cargo runs: the gateway's build script copies `ui/dist` into
      # the binary.
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: console
          path: ui/dist
      - name: Tools for musl
        if: contains(matrix.target, 'musl')
        run: sudo apt-get update && sudo apt-get install -y musl-tools
      # The toolchain is the one `rust-toolchain.toml` names.
      - name: Install Rust
        run: |
          rustup toolchain install --profile minimal
          rustup target add ${{ matrix.target }}
      # No cache: a release is built from nothing an earlier run left.
      - name: Build
        run: cargo build --release --locked -p ultrafast-gateway --target ${{ matrix.target }}
      - name: Smoke test
        run: ./target/${{ matrix.target }}/release/ultrafast --version
      - name: Package
        run: |
          exe=ultrafast
          if [ "${{ matrix.archive }}" = "zip" ]; then exe=ultrafast.exe; fi
          ref="${GITHUB_REF_NAME//\//-}"
          name="ultrafast-${ref}-${{ matrix.target }}"
          mkdir -p "dist/$name"
          cp "target/${{ matrix.target }}/release/$exe" README.md LICENSE CHANGELOG.md "dist/$name/"
          cd dist
          if [ "${{ matrix.archive }}" = "zip" ]; then
            7z a "$name.zip" "$name" > /dev/null
            file="$name.zip"
          else
            tar -czf "$name.tar.gz" "$name"
            file="$name.tar.gz"
          fi
          # The checksum names the file as it is next to it.
          if command -v sha256sum > /dev/null; then sha256sum "$file" > "$file.sha256"; else shasum -a 256 "$file" > "$file.sha256"; fi
          cat "$file.sha256"
          ls -l "$file" | awk '{printf "archive size: %.1f MB\n", $5/1048576}'
          rm -rf "$name"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-${{ matrix.target }}
          path: |
            dist/*.tar.gz
            dist/*.zip
            dist/*.sha256
          if-no-files-found: error
          retention-days: 14

  release:
    name: Draft release
    needs: build
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: release-*
          merge-multiple: true
          path: dist
      - name: Checksums
        working-directory: dist
        run: |
          cat ./*.sha256 > SHA256SUMS
          sha256sum --check SHA256SUMS
          rm ./*.sha256
          ls -l
      # A draft: a person reads it and publishes it.
      - name: Draft the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          pre=""
          case "$GITHUB_REF_NAME" in *-*) pre="--prerelease" ;; esac
          gh release create "$GITHUB_REF_NAME" dist/* \
            --draft --verify-tag $pre \
            --title "$GITHUB_REF_NAME" --generate-notes

  docker-publish:
    name: Image on ghcr.io
    needs: release
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - id: meta
        uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051 # v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/ultrafast-ai-gateway
          tags: |
            type=semver,pattern={{version}}
            type=raw,value=latest,enable=${{ !contains(github.ref_name, '-') }}
      # The Dockerfile builds the console and the binary itself. linux/amd64
      # only for now: an arm64 image would be built on an arm64 runner (LATER).
      - uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
