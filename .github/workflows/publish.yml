# Publishes the client packages on a tag `v*`: crates.io (ultrafast-translate,
# then ultrafast-client), PyPI (ultrafast, ultrafast-admin; trusted publishing,
# no stored tokens) and npm (@ultrafast/client, @ultrafast/admin; trusted
# publishing with provenance).
#
# It publishes nothing until the owner has registered the trusted publishers
# and set the repository variable PUBLISH_LIVE to `true` (docs/RELEASING.md).
# Before that, every run is a dry run: the same builds, `cargo publish
# --dry-run`, `twine check`, `pnpm publish --dry-run`. By hand
# (workflow_dispatch) `dry_run` defaults to true.
name: Publish

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Dry run: build and check, publish nothing"
        type: boolean
        default: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  # First: the tag, Cargo.toml and every package manifest name one version.
  # `live` is true only for a real run with PUBLISH_LIVE=true on a v* tag.
  plan:
    name: Plan
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      live: ${{ steps.live.outputs.live }}
      version: ${{ steps.versions.outputs.version }}
      npm_tag: ${{ steps.versions.outputs.npm_tag }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Versions agree
        id: versions
        run: |
          version=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -n 1)
          py=$(echo "$version" | sed -E 's/-alpha\./a/; s/-beta\./b/; s/-rc\./rc/')
          fail=0
          check() { if [ "$2" != "$3" ]; then echo "$1 says $2, expected $3" >&2; fail=1; fi; }
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then check "tag $GITHUB_REF_NAME" "${GITHUB_REF_NAME#v}" "$version"; fi
          for f in clients/ts clients/admin-ts; do
            check "$f/package.json" "$(sed -n 's/^  "version": "\(.*\)",/\1/p' $f/package.json)" "$version"
          done
          for f in crates/client-py clients/admin-py; do
            check "$f/pyproject.toml" "$(sed -n 's/^version = "\(.*\)"/\1/p' $f/pyproject.toml | head -n 1)" "$py"
          done
          check "ultrafast-translate dependency of ultrafast-client" \
            "$(sed -n 's/^ultrafast-translate = { version = "\([^"]*\)".*/\1/p' crates/client/Cargo.toml)" "$version"
          [ "$fail" = 0 ] || exit 1
          echo "version=$version" >> "$GITHUB_OUTPUT"
          case "$version" in *-*) echo "npm_tag=beta" >> "$GITHUB_OUTPUT" ;; *) echo "npm_tag=latest" >> "$GITHUB_OUTPUT" ;; esac
      - name: Live or dry run
        id: live
        env:
          PUBLISH_LIVE: ${{ vars.PUBLISH_LIVE }}
          DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run || 'false' }}
        run: |
          if [ "$PUBLISH_LIVE" = "true" ] && [ "$DRY_RUN" != "true" ]; then
            case "$GITHUB_REF" in
              refs/tags/v*) ;;
              *) echo "Live publishing needs a tag ref (refs/tags/v*); this run is on $GITHUB_REF. Use dry_run=true or run from a version tag." >&2; exit 1 ;;
            esac
            echo "live=true" >> "$GITHUB_OUTPUT"
          else
            echo "live=false" >> "$GITHUB_OUTPUT"
            echo "Dry run: PUBLISH_LIVE=${PUBLISH_LIVE:-unset}, dry_run=$DRY_RUN" >> "$GITHUB_STEP_SUMMARY"
          fi

  # ---- crates.io ----------------------------------------------------------
  crates-check:
    name: Crates (dry run)
    needs: plan
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@89b12181fb390509a0842a86cc55eeb8eb928c1d # stable
      # Both in one command: ultrafast-client depends on this version of
      # ultrafast-translate, which is not on crates.io yet, and cargo
      # (1.90 and newer) resolves it from the same publish, in order.
      - run: cargo publish --dry-run --locked -p ultrafast-translate -p ultrafast-client

  crates:
    name: Crates (publish)
    if: needs.plan.outputs.live == 'true'
    needs: [plan, crates-check, pypi-check, npm-check]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: release
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@89b12181fb390509a0842a86cc55eeb8eb928c1d # stable
      - name: Is there an API token
        id: token
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: |
          if [ -n "$CARGO_REGISTRY_TOKEN" ]; then echo "have=true" >> "$GITHUB_OUTPUT"; else echo "have=false" >> "$GITHUB_OUTPUT"; fi
      - uses: rust-lang/crates-io-auth-action@c6f97d42243bad5fab37ca0427f495c86d5b1a18 # v1.0.5
        if: steps.token.outputs.have == 'false'
        id: auth
      - name: Publish ultrafast-translate, then ultrafast-client
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN || steps.auth.outputs.token }}
        run: |
          cargo publish --locked -p ultrafast-translate -p ultrafast-client

  # ---- PyPI ---------------------------------------------------------------
  pypi-wheels:
    name: Wheel ${{ matrix.os }} ${{ matrix.target }}
    needs: plan
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, target: x86_64 }
          - { os: ubuntu-latest, target: aarch64 }
          - { os: macos-15-intel, target: x86_64 }
          - { os: macos-latest, target: aarch64 }
          - { os: windows-latest, target: x64 }
          - { os: windows-11-arm, target: aarch64 }
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: PyO3/maturin-action@e83996d129638aa358a18fbd1dfb82f0b0fb5d3b # v1
        with:
          working-directory: crates/client-py
          target: ${{ matrix.target }}
          args: --release --out dist
          manylinux: auto
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: py-wheels-${{ matrix.os }}-${{ matrix.target }}
          path: crates/client-py/dist

  pypi-sdists:
    name: Python sdists and admin wheel
    needs: plan
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: PyO3/maturin-action@e83996d129638aa358a18fbd1dfb82f0b0fb5d3b # v1
        with:
          working-directory: crates/client-py
          command: sdist
          args: --out dist
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - name: Build ultrafast-admin
        run: |
          python -m pip install build
          python -m build clients/admin-py --outdir clients/admin-py/dist
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: py-sdists
          path: |
            crates/client-py/dist
            clients/admin-py/dist

  # The dry run of PyPI: every file passes `twine check`; nothing is uploaded.
  pypi-check:
    name: PyPI (dry run)
    needs: [pypi-wheels, pypi-sdists]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: py-*
          path: dist-in
          merge-multiple: true
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - name: Gather and check
        run: |
          mkdir dist
          find dist-in -type f \( -name '*.whl' -o -name '*.tar.gz' \) -exec cp {} dist/ \;
          ls -l dist
          python -m pip install twine
          twine check --strict dist/*
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: pypi-dist
          path: dist

  pypi:
    name: PyPI (publish)
    if: needs.plan.outputs.live == 'true'
    needs: [plan, pypi-check, crates-check, npm-check]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: release
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: pypi-dist
          path: dist
      - uses: pypa/gh-action-pypi-publish@a892a5a61159132606e93a2fa6f4358831b04d26 # v1.14.2
        with:
          packages-dir: dist
          skip-existing: true
          print-hash: true

  # ---- npm ----------------------------------------------------------------
  npm-check:
    name: npm (dry run)
    needs: plan
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@89b12181fb390509a0842a86cc55eeb8eb928c1d # stable
        with:
          targets: wasm32-unknown-unknown
      # The CLI must match the pinned wasm-bindgen crate (0.2.129).
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        id: wasm-bindgen
        with:
          path: ~/.cargo/bin/wasm-bindgen
          key: wasm-bindgen-cli-0.2.129-${{ runner.os }}
      - if: steps.wasm-bindgen.outputs.cache-hit != 'true'
        run: cargo install --locked wasm-bindgen-cli --version 0.2.129
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          package_json_file: clients/ts/package.json
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
      - name: Build and pack both packages
        run: |
          for d in clients/ts clients/admin-ts; do
            pnpm --dir $d install --frozen-lockfile
            pnpm --dir $d build
            pnpm --dir $d publish --dry-run --no-git-checks --access public --tag "${{ needs.plan.outputs.npm_tag }}"
          done

  npm:
    name: npm (publish)
    if: needs.plan.outputs.live == 'true'
    needs: [plan, npm-check, crates-check, pypi-check]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: release
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@89b12181fb390509a0842a86cc55eeb8eb928c1d # stable
        with:
          targets: wasm32-unknown-unknown
      - run: cargo install --locked wasm-bindgen-cli --version 0.2.129
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          package_json_file: clients/ts/package.json
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
      # Trusted publishing (OIDC) needs npm 11.5.1 or newer.
      - run: npm install -g npm@11.6.2
      - name: Publish
        run: |
          for d in clients/ts clients/admin-ts; do
            pnpm --dir $d install --frozen-lockfile
            pnpm --dir $d build
            pnpm --dir $d publish --no-git-checks --access public --provenance --tag "${{ needs.plan.outputs.npm_tag }}"
          done
