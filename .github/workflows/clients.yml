# The Rust, Python and TypeScript clients and the admin SDKs: tests on every
# change to them, and wheels on a `py-v*` tag. Config only: nothing here publishes; uploading to
# PyPI or npm needs the owner's credentials and a decision.
name: clients

on:
  push:
    branches: [main, v2]
    tags: ["py-v*"]
    paths:
      - "crates/translate/**"
      - "crates/client/**"
      - "crates/client-wasm/**"
      - "crates/client-py/**"
      - "clients/**"
      - "openapi/admin.json"
      - "clients/admin-ts/**"
      - "clients/admin-py/**"
      - "crates/gateway/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - ".github/workflows/clients.yml"
  pull_request:
    branches: [main, v2]
    paths:
      - "crates/translate/**"
      - "crates/client/**"
      - "crates/client-wasm/**"
      - "crates/client-py/**"
      - "clients/**"
      - "openapi/admin.json"
      - "clients/admin-ts/**"
      - "clients/admin-py/**"
      - "crates/gateway/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - ".github/workflows/clients.yml"
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  rust:
    name: Rust client
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@89b12181fb390509a0842a86cc55eeb8eb928c1d # stable
        with:
          components: rustfmt, clippy
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-clients-rust-${{ hashFiles('Cargo.lock') }}
      - run: cargo fmt -p ultrafast-translate -p ultrafast-client -p ultrafast-client-wasm -- --check
      - run: cargo clippy -p ultrafast-translate -p ultrafast-client -p ultrafast-client-wasm --all-targets -- -D warnings
      # Includes the parity fixtures (crates/client/tests/fixtures.rs) and the
      # wasm boundary tests.
      - run: cargo test -p ultrafast-translate -p ultrafast-client -p ultrafast-client-wasm

  wasm-and-typescript:
    name: WebAssembly build, smoke test and TypeScript client
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@89b12181fb390509a0842a86cc55eeb8eb928c1d # stable
        with:
          targets: wasm32-unknown-unknown
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-clients-wasm-${{ hashFiles('Cargo.lock') }}
      # The CLI must match the pinned wasm-bindgen crate (0.2.129).
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        id: wasm-bindgen
        with:
          path: ~/.cargo/bin/wasm-bindgen
          key: wasm-bindgen-cli-0.2.129-${{ runner.os }}
      - if: steps.wasm-bindgen.outputs.cache-hit != 'true'
        run: cargo install --locked wasm-bindgen-cli --version 0.2.129
      - name: Build the wasm package and run the Node smoke test
        run: |
          bash crates/client-wasm/build.sh /tmp/uf-wasm-pkg nodejs
          node crates/client-wasm/smoke/smoke.mjs /tmp/uf-wasm-pkg
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          package_json_file: clients/ts/package.json
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: clients/ts/pnpm-lock.yaml
      - name: TypeScript client
        working-directory: clients/ts
        run: |
          pnpm install --frozen-lockfile
          pnpm build:wasm
          pnpm lint
          pnpm typecheck
          pnpm test
          pnpm build

  python:
    name: Python client (Linux)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@89b12181fb390509a0842a86cc55eeb8eb928c1d # stable
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-clients-py-${{ hashFiles('Cargo.lock') }}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - name: Build the extension and run the tests
        working-directory: crates/client-py
        run: |
          python -m venv .venv
          . .venv/bin/activate
          pip install maturin pytest pytest-asyncio
          maturin develop
          pytest

  # The admin SDKs are generated from openapi/admin.json. Each job regenerates
  # its SDK and fails when that changes a file (the SDK was not regenerated
  # after an admin API change), then runs its tests against the real gateway
  # (a debug build, the console is not needed).
  admin-typescript:
    name: Admin SDK (TypeScript)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      UF_E2E_BINARY: ${{ github.workspace }}/target/debug/ultrafast
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@89b12181fb390509a0842a86cc55eeb8eb928c1d # stable
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-clients-admin-${{ hashFiles('Cargo.lock') }}
      - name: Build the gateway (debug)
        run: cargo build --locked -p ultrafast-gateway
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          package_json_file: clients/admin-ts/package.json
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: clients/admin-ts/pnpm-lock.yaml
      - name: Install
        working-directory: clients/admin-ts
        run: pnpm install --frozen-lockfile
      - name: The generated types are current
        working-directory: clients/admin-ts
        run: |
          pnpm gen
          # Untracked files count: a new operation is a new file.
          git add -N .
          git diff --exit-code -- .
      - name: Lint, typecheck, test and build
        working-directory: clients/admin-ts
        run: |
          pnpm lint
          pnpm typecheck
          pnpm test
          pnpm build

  admin-python:
    name: Admin SDK (Python ${{ matrix.python }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        # The oldest the package supports, and 3.14, which constraints.txt is pinned for
        # (the regeneration check runs there; a newer minor is a deliberate change).
        python: ["3.11", "3.14"]
    env:
      UF_E2E_BINARY: ${{ github.workspace }}/target/debug/ultrafast
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@89b12181fb390509a0842a86cc55eeb8eb928c1d # stable
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-clients-admin-${{ hashFiles('Cargo.lock') }}
      - name: Build the gateway (debug)
        run: cargo build --locked -p ultrafast-gateway
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python }}
      # gen.sh pins the generator, the formatter and their dependencies; its
      # output is the same on every Python, so it is checked once.
      - name: The generated client is current
        if: matrix.python == '3.14'
        working-directory: clients/admin-py
        run: |
          ./gen.sh
          # Untracked files count: every operation is a module of its own.
          git add -N .
          git diff --exit-code -- .
      - name: Tests
        working-directory: clients/admin-py
        run: |
          python -m venv .venv
          . .venv/bin/activate
          pip install -e '.[test]'
          pytest

  # Wheels and the sdist: on a `py-v*` tag, or by hand from the Actions tab.
  wheels:
    if: startsWith(github.ref, 'refs/tags/py-v') || github.event_name == 'workflow_dispatch'
    needs: [rust, wasm-and-typescript, python]
    name: wheel ${{ matrix.os }} ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, target: x86_64 }
          - { os: ubuntu-latest, target: aarch64 }
          - { os: macos-15-intel, target: x86_64 }
          - { os: macos-latest, target: aarch64 }
          - { os: windows-latest, target: x64 }
          - { os: windows-11-arm, target: aarch64 }
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: PyO3/maturin-action@e83996d129638aa358a18fbd1dfb82f0b0fb5d3b # v1
        with:
          working-directory: crates/client-py
          target: ${{ matrix.target }}
          args: --release --out dist
          manylinux: auto
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: wheels-${{ matrix.os }}-${{ matrix.target }}
          path: crates/client-py/dist

  sdist:
    if: startsWith(github.ref, 'refs/tags/py-v') || github.event_name == 'workflow_dispatch'
    needs: [python]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: PyO3/maturin-action@e83996d129638aa358a18fbd1dfb82f0b0fb5d3b # v1
        with:
          working-directory: crates/client-py
          command: sdist
          args: --out dist
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: sdist
          path: crates/client-py/dist
