name: CI

on:
  push:
    branches: [main, v2]
  pull_request:
    branches: [main, v2]

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  build-test:
    name: Lint and test
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@89b12181fb390509a0842a86cc55eeb8eb928c1d # stable
        with:
          components: rustfmt, clippy
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('Cargo.lock') }}
      # The console is compiled into the binary, and the tests marked
      # `ignore` check the one that is really in it.
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          package_json_file: ui/package.json
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: ui/pnpm-lock.yaml
      - name: Build the console
        run: |
          pnpm --dir ui install --frozen-lockfile
          pnpm --dir ui build
      - name: Format check
        run: cargo fmt --all -- --check
      - name: Clippy
        run: cargo clippy --locked --all-targets --all-features -- -D warnings
      - name: Tests
        run: cargo test --all --locked --no-fail-fast -- --include-ignored
      # The guardrail CPU tests measure how scanning scales and only make
      # sense in an optimised build (they are compiled out of debug builds).
      - name: Guardrail CPU tests (release)
        run: cargo test --release --locked -p ultrafast-gateway --lib guardrails
      - name: OpenAPI spec is current
        run: |
          if ! cargo run -q -p ultrafast-gateway -- openapi | diff - openapi/admin.json; then
            echo "openapi/admin.json is out of date; run: cargo run -p ultrafast-gateway -- openapi > openapi/admin.json"
            exit 1
          fi
      - name: Build image
        run: docker build -t ultrafast:ci .
      - name: Run image
        run: docker run --rm ultrafast:ci --version
      - name: Report binary size
        run: |
          cargo build --release --locked -p ultrafast-gateway
          ls -l target/release/ultrafast | awk '{printf "binary size: %.1f MB\n", $5/1048576}'

  postgres:
    name: Postgres
    runs-on: ubuntu-latest
    timeout-minutes: 40
    # The whole gateway suite again, against PostgreSQL: every test store is
    # its own schema in this one database (UF_TEST_DATABASE_URL).
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      UF_TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/postgres
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@89b12181fb390509a0842a86cc55eeb8eb928c1d # stable
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-postgres-${{ hashFiles('Cargo.lock') }}
      - name: Tests on PostgreSQL
        run: cargo test --locked --workspace --exclude ultrafast-client-py --no-fail-fast

  secrets:
    name: Secret scan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # The whole history is scanned, so a secret that was committed and then
      # removed still fails. Known test placeholders are in .gitleaks.toml.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Install gitleaks
        run: |
          version=8.30.1
          curl -sSfL "https://github.com/gitleaks/gitleaks/releases/download/v${version}/gitleaks_${version}_linux_x64.tar.gz" | tar -xz -C "$RUNNER_TEMP" gitleaks
      - name: Scan
        run: '"$RUNNER_TEMP"/gitleaks git --no-banner --redact -c .gitleaks.toml .'

  msrv:
    name: Minimum Rust version
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@3f004e7c9fe9026f3384e581eb4a157ada8ef5b8 # 1.94
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-msrv-${{ hashFiles('Cargo.lock') }}
      # The console is compiled into the binary, and the tests marked
      # `ignore` check the one that is really in it.
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          package_json_file: ui/package.json
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: ui/pnpm-lock.yaml
      - name: Build the console
        run: |
          pnpm --dir ui install --frozen-lockfile
          pnpm --dir ui build
      - name: Tests
        run: cargo test --all --locked -- --include-ignored

  console:
    name: Console
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: ui
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # The pnpm version is the one recorded in ui/package.json "packageManager".
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          package_json_file: ui/package.json
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: ui/pnpm-lock.yaml
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: Lint
        run: pnpm lint
      - name: Generated API types are current
        run: pnpm check:api
      - name: Typecheck
        run: pnpm typecheck
      - name: Tests
        run: pnpm test
      - name: Build
        run: pnpm build

  e2e:
    name: Console in a browser
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@89b12181fb390509a0842a86cc55eeb8eb928c1d # stable
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-e2e-${{ hashFiles('Cargo.lock') }}
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          package_json_file: ui/package.json
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: ui/pnpm-lock.yaml
      # The browser tests start the real binary, which embeds the console:
      # the console is built first, then the binary.
      - name: Build the console
        run: |
          pnpm --dir ui install --frozen-lockfile
          pnpm --dir ui build
      - name: Build the gateway
        run: cargo build --release --locked -p ultrafast-gateway
      - name: Install Chromium
        run: pnpm --dir ui exec playwright install --with-deps chromium
      # The errors are in this log. Nothing of the run is uploaded: what a
      # failure writes may hold the test's (random, short-lived) credentials.
      - name: Browser tests
        run: pnpm --dir ui test:e2e
