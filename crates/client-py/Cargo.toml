[package]
name = "ultrafast-client-py"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Python client for the Ultrafast gateway and for LLM providers directly (PyO3 around the Rust client)."
publish = false

[lib]
name = "_native"
crate-type = ["cdylib"]
# The tests are pytest (crates/client-py/tests); a Rust test binary would have
# to link libpython, which the abi3 extension module deliberately does not.
test = false
doctest = false

[dependencies]
ultrafast-client = { path = "../client" }
# The one OpenAI-format parser for dict messages and tools.
ultrafast-translate = { path = "../translate" }
serde_json.workspace = true
futures.workspace = true
# abi3: one wheel per platform for Python 3.9 and newer. The `extension-module`
# feature is added by maturin (pyproject.toml), so `cargo test` still links.
pyo3 = { version = "0.29", features = ["abi3-py39"] }
pyo3-async-runtimes = { version = "0.29", features = ["tokio-runtime"] }
tokio.workspace = true
