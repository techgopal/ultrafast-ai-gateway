[workspace]
resolver = "2"
members = ["crates/translate", "crates/gateway"]
exclude = ["ultrafast-gateway", "ultrafast-models-sdk"]

[workspace.package]
version = "2.0.0-alpha.1"
edition = "2021"
rust-version = "1.88"
license = "MIT"
repository = "https://github.com/techgopal/ultrafast-ai-gateway"

[workspace.dependencies]
anyhow = "1"
async-stream = "0.3"
axum = "0.8"
bytes = "1"
chacha20poly1305 = "0.10"
clap = { version = "4", features = ["derive", "env"] }
futures = "0.3"
hex = "0.4"
http-body-util = "0.1"
rand = "0.8"
reqwest = { version = "0.12", default-features = false, features = ["json", "stream", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio", "sqlite", "migrate", "macros"] }
tempfile = "3"
thiserror = "2"
time = { version = "0.3", features = ["parsing", "formatting", "macros"] }
tokio = { version = "1", features = ["full"] }
tower = { version = "0.5", features = ["util"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
wiremock = "0.6"
