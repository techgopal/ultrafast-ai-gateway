[workspace]
resolver = "2"
members = ["crates/translate", "crates/gateway", "crates/client", "crates/client-wasm", "crates/client-py"]

[workspace.package]
version = "2.0.0-beta.4"
edition = "2021"
rust-version = "1.94"
license = "MIT"
repository = "https://github.com/techgopal/ultrafast-ai-gateway"

[workspace.dependencies]
anyhow = "1"
arc-swap = "1"
argon2 = { version = "0.6", features = ["rand_core"] }
async-stream = "0.3"
axum = "0.8"
bytes = "1"
multer = "3"
chacha20poly1305 = "0.11"
clap = { version = "4", features = ["derive", "env"] }
flate2 = "1"
futures = "0.3"
hex = "0.4"
hmac = "0.13"
ipnet = "2"
http-body-util = "0.1"
mime_guess = "2"
regex = "1"
regex-syntax = "0.8"
rand = "0.10"
reqwest = { version = "0.13", default-features = false, features = ["json", "stream", "rustls", "multipart"] }
rust-embed = { version = "8", features = ["interpolate-folder-path", "debug-embed"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11"
sqlx = { version = "0.9", default-features = false, features = ["runtime-tokio", "sqlite", "postgres", "any", "migrate", "macros", "tls-rustls-aws-lc-rs"] }
tempfile = "3"
thiserror = "2"
time = { version = "0.3", features = ["parsing", "formatting", "macros"] }
tokio = { version = "1", features = ["full"] }
tower = { version = "0.5", features = ["util"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
utoipa = { version = "6", features = ["axum_extras"] }
utoipa-axum = "0.3"
wiremock = "0.6"
